name: Verify production SFTP access

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-sftp-verification
  cancel-in-progress: false

jobs:
  verify:
    name: Verify password authentication and chroot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production

    steps:
      - name: Configure pinned SFTP host identity
        shell: bash
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
          SFTP_PORT: ${{ vars.SFTP_PORT || '22' }}
          SFTP_REMOTE_PATH: ${{ vars.SFTP_REMOTE_PATH }}
        run: |
          set -euo pipefail
          for required_value in \
            "$SFTP_HOST" \
            "$SFTP_USERNAME" \
            "$SFTP_PASSWORD" \
            "$SFTP_KNOWN_HOSTS" \
            "$SFTP_REMOTE_PATH"; do
            if [[ -z "$required_value" ]]; then
              echo 'A required production environment secret or variable is missing.' >&2
              exit 1
            fi
          done

          if [[ ! "$SFTP_PORT" =~ ^[0-9]+$ ]]; then
            echo 'SFTP_PORT must contain digits only.' >&2
            exit 1
          fi

          install -d -m 700 "$RUNNER_TEMP/smps-ssh"
          printf '%s\n' "$SFTP_KNOWN_HOSTS" > "$RUNNER_TEMP/smps-ssh/known_hosts"
          cat > "$RUNNER_TEMP/smps-ssh/askpass.sh" <<'EOF'
          #!/bin/sh
          printf '%s\n' "$SFTP_PASSWORD"
          EOF
          chmod 600 "$RUNNER_TEMP/smps-ssh/known_hosts"
          chmod 700 "$RUNNER_TEMP/smps-ssh/askpass.sh"

      - name: Verify read-only SFTP access
        shell: bash
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PORT: ${{ vars.SFTP_PORT || '22' }}
          SFTP_REMOTE_PATH: ${{ vars.SFTP_REMOTE_PATH }}
        run: |
          set -euo pipefail
          batch_file="$RUNNER_TEMP/smps-ssh/verify.sftp"
          printf '%s\n' \
            'pwd' \
            'cd ..' \
            'pwd' \
            'quit' \
            > "$batch_file"

          export SSH_ASKPASS="$RUNNER_TEMP/smps-ssh/askpass.sh"
          export SSH_ASKPASS_REQUIRE=force
          export DISPLAY=:0

          set +e
          sftp_output="$(
            setsid --wait sftp \
              -b "$batch_file" \
              -o BatchMode=no \
              -o PreferredAuthentications=password \
              -o PubkeyAuthentication=no \
              -o NumberOfPasswordPrompts=1 \
              -o StrictHostKeyChecking=yes \
              -o "UserKnownHostsFile=$RUNNER_TEMP/smps-ssh/known_hosts" \
              -P "$SFTP_PORT" \
              "${SFTP_USERNAME}@${SFTP_HOST}:${SFTP_REMOTE_PATH}" \
              2>&1
          )"
          sftp_status=$?
          set -e

          if [[ "$sftp_status" -ne 0 ]]; then
            printf '%s\n' "$sftp_output" >&2
            echo 'The read-only SFTP verification failed.' >&2
            exit "$sftp_status"
          fi

          root_count="$(grep -cFx 'Remote working directory: /' <<< "$sftp_output" || true)"
          if [[ "$root_count" -ne 2 ]]; then
            echo 'The SFTP account did not remain at its expected chroot root.' >&2
            exit 1
          fi

          echo 'Password authentication, pinned host identity, target path, and chroot verified.'
