name: Verify production SFTP access

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only preflight or isolated reversible write test
        required: true
        default: read-only
        type: choice
        options:
          - read-only
          - write-test

permissions:
  contents: read

concurrency:
  group: production-sftp-verification
  cancel-in-progress: false

jobs:
  verify:
    name: Verify runner-originated SFTP access
    runs-on: smps-production
    timeout-minutes: 10
    environment:
      name: production
    env:
      SFTP_HOST: ${{ secrets.SFTP_HOST }}
      SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
      SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
      SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
      SFTP_PORT: ${{ vars.SFTP_PORT || '222' }}
      SFTP_REMOTE_PATH: ${{ vars.SFTP_REMOTE_PATH }}
      PROBE_DIRECTORY: .smps-deploy-probe-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out the SFTP policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify password authentication and restricted root
        shell: bash
        run: |
          set -euo pipefail
          batch_file="$RUNNER_TEMP/read-only.sftp"
          printf '%s\n' \
            'pwd' \
            'cd ..' \
            'pwd' \
            'quit' \
            > "$batch_file"

          sftp_output="$(bash tools/run_production_sftp.sh "$batch_file")"
          root_count="$(grep -cFx 'Remote working directory: /' <<< "$sftp_output" || true)"
          if [[ "$root_count" -ne 2 ]]; then
            echo 'The SFTP account did not remain at its expected restricted root.' >&2
            exit 1
          fi

          echo 'Password authentication, pinned host identity, target, and restricted root verified.'

      - name: Verify isolated create, upload, rename, download, and content
        if: inputs.mode == 'write-test'
        shell: bash
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/probe-marker.txt"
          downloaded="$RUNNER_TEMP/probe-downloaded.txt"
          printf 'SMPS deployment write probe %s/%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$marker"

          cat > "$RUNNER_TEMP/write-test.sftp" <<EOF
          mkdir "$PROBE_DIRECTORY"
          put "$marker" "$PROBE_DIRECTORY/marker.txt"
          rename "$PROBE_DIRECTORY/marker.txt" "$PROBE_DIRECTORY/verified.txt"
          get "$PROBE_DIRECTORY/verified.txt" "$downloaded"
          quit
          EOF
          bash tools/run_production_sftp.sh "$RUNNER_TEMP/write-test.sftp"
          cmp "$marker" "$downloaded"
          echo 'Isolated create, upload, rename, download, and content verification passed.'

      - name: Remove the isolated write probe
        if: always() && inputs.mode == 'write-test'
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/cleanup-write-test.sftp" <<EOF
          -rm "$PROBE_DIRECTORY/marker.txt"
          -rm "$PROBE_DIRECTORY/verified.txt"
          -rmdir "$PROBE_DIRECTORY"
          quit
          EOF
          bash tools/run_production_sftp.sh "$RUNNER_TEMP/cleanup-write-test.sftp"
          echo 'The isolated write probe was removed.'
