name: Verify production SFTP access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify password authentication and chroot
    runs-on: ubuntu-latest

    steps:
      - name: Explain reviewed local handoff
        shell: bash
        run: |
          cat <<'EOF'
          GitHub-hosted runners cannot reliably reach the production SFTP endpoint on port 222.
          Run the reviewed local preflight instead:

            ./tools/deploy-production.ps1 -CiRunId <successful-ci-run-id> -Mode Preflight

          See docs/deployment.md for the approved local deployment handoff.
          EOF
