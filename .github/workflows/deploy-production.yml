name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful CI push run ID from main
        required: true
        type: string
      mode:
        description: Normal delta or explicit full repair overlay
        required: true
        default: normal
        type: choice
        options:
          - normal
          - force-full
      confirm_sha:
        description: Full target SHA; required only for force-full
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tested revision
    if: >-
      github.event_name == 'workflow_dispatch'
      || (
        github.event.workflow_run.conclusion == 'success'
        && vars.AUTO_DEPLOY_ENABLED == 'true'
      )
    runs-on: ubuntu-latest
    outputs:
      ci_run_id: ${{ steps.ci.outputs.ci_run_id }}
      deploy_sha: ${{ steps.ci.outputs.deploy_sha }}
      deploy_mode: ${{ steps.ci.outputs.deploy_mode }}
      should_deploy: ${{ steps.ci.outputs.should_deploy }}
    env:
      REQUESTED_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.ci_run_id }}
      REQUESTED_MODE: ${{ github.event_name == 'workflow_run' && 'normal' || inputs.mode }}
      CONFIRM_SHA: ${{ inputs.confirm_sha }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Validate the CI run and artifact
        id: ci
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo 'The CI run ID must contain digits only.' >&2
            exit 1
          fi

          default_branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')"
          if [[ "$default_branch" != 'main' ]]; then
            echo "Expected default branch main, got ${default_branch}." >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/${default_branch}" ]]; then
            echo 'The deployment workflow must run from the default branch.' >&2
            exit 1
          fi

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${REQUESTED_RUN_ID}")"
          if ! jq --exit-status --arg branch "$default_branch" --arg repo "$GITHUB_REPOSITORY" '
            .name == "CI"
            and .event == "push"
            and .status == "completed"
            and .conclusion == "success"
            and .head_branch == $branch
            and .head_repository.full_name == $repo
          ' <<< "$run_json" >/dev/null; then
            echo 'Select a successful completed CI push run from this repository main branch.' >&2
            exit 1
          fi

          deploy_sha="$(jq --raw-output '.head_sha' <<< "$run_json")"
          if [[ ! "$deploy_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'The selected CI run has an invalid commit SHA.' >&2
            exit 1
          fi

          artifact_count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${REQUESTED_RUN_ID}/artifacts" \
            --jq "[.artifacts[] | select(.name == \"smps-${deploy_sha}\" and .expired == false)] | length")"
          if [[ "$artifact_count" != '1' ]]; then
            echo 'The selected CI run must contain exactly one unexpired SHA-named artifact.' >&2
            exit 1
          fi

          deploy_mode="${REQUESTED_MODE:-normal}"
          if [[ "$deploy_mode" != 'normal' && "$deploy_mode" != 'force-full' ]]; then
            echo 'Deployment mode must be normal or force-full.' >&2
            exit 1
          fi
          if [[ "$deploy_mode" == 'force-full' && "$CONFIRM_SHA" != "$deploy_sha" ]]; then
            echo 'force-full requires the complete selected commit SHA in confirm_sha.' >&2
            exit 1
          fi

          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${default_branch}" --jq '.sha')"
          should_deploy=true
          if [[ "$deploy_mode" == 'normal' && "$deploy_sha" != "$current_sha" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == 'workflow_run' ]]; then
              echo "Skipping stale successful run ${deploy_sha}; main is ${current_sha}."
              should_deploy=false
            else
              echo 'Normal manual deployment accepts only the current main commit.' >&2
              exit 1
            fi
          fi

          echo "ci_run_id=${REQUESTED_RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "deploy_sha=${deploy_sha}" >> "$GITHUB_OUTPUT"
          echo "deploy_mode=${deploy_mode}" >> "$GITHUB_OUTPUT"
          echo "should_deploy=${should_deploy}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy tested artifact over SFTP
    needs: validate
    if: needs.validate.outputs.should_deploy == 'true'
    runs-on: smps-production
    timeout-minutes: 45
    environment:
      name: production
      url: https://smps.rkcomputer.cz
    env:
      CI_RUN_ID: ${{ needs.validate.outputs.ci_run_id }}
      DEPLOY_SHA: ${{ needs.validate.outputs.deploy_sha }}
      DEPLOY_MODE: ${{ needs.validate.outputs.deploy_mode }}
      SFTP_HOST: ${{ secrets.SFTP_HOST }}
      SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
      SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
      SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
      SFTP_PORT: ${{ vars.SFTP_PORT || '222' }}
      SFTP_REMOTE_PATH: ${{ vars.SFTP_REMOTE_PATH }}

    steps:
      - name: Check out deployment policy from the trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Download the tested artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: smps-${{ env.DEPLOY_SHA }}
          path: ${{ runner.temp }}/artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.CI_RUN_ID }}

      - name: Verify and extract the artifact
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/artifact/smps-${DEPLOY_SHA}.tar.gz"
          test -f "$archive"
          python3 tools/audit_public_content.py archive "$archive"
          mkdir -p "$RUNNER_TEMP/release"
          tar --extract --gzip --file "$archive" \
            --directory "$RUNNER_TEMP/release" \
            --no-same-owner \
            --no-same-permissions

      - name: Read current release metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/remote"
          cat > "$RUNNER_TEMP/read-metadata.sftp" <<EOF
          -get "RELEASE_SHA" "$RUNNER_TEMP/remote/RELEASE_SHA"
          -get "RELEASE_MANIFEST.sha256" "$RUNNER_TEMP/remote/RELEASE_MANIFEST.sha256"
          quit
          EOF
          bash tools/run_production_sftp.sh "$RUNNER_TEMP/read-metadata.sftp"

      - name: Plan the exact file delta
        shell: bash
        run: |
          set -euo pipefail
          arguments=(
            plan
            --candidate-root "$RUNNER_TEMP/release"
            --mode "$DEPLOY_MODE"
            --expected-sha "$DEPLOY_SHA"
            --output "$RUNNER_TEMP/deploy-plan.json"
          )
          if [[ -f "$RUNNER_TEMP/remote/RELEASE_MANIFEST.sha256" ]]; then
            arguments+=(--remote-manifest "$RUNNER_TEMP/remote/RELEASE_MANIFEST.sha256")
          fi
          if [[ -f "$RUNNER_TEMP/remote/RELEASE_SHA" ]]; then
            arguments+=(--remote-sha "$RUNNER_TEMP/remote/RELEASE_SHA")
          fi
          python3 tools/production_deploy.py "${arguments[@]}"
          python3 tools/production_deploy.py batch \
            --plan "$RUNNER_TEMP/deploy-plan.json" \
            --candidate-root "$RUNNER_TEMP/release" \
            --output "$RUNNER_TEMP/deploy.sftp"

      - name: Upload changed files and exact tracked deletions
        shell: bash
        run: bash tools/run_production_sftp.sh "$RUNNER_TEMP/deploy.sftp"

      - name: Verify deployed release metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/verified"
          cat > "$RUNNER_TEMP/verify-metadata.sftp" <<EOF
          get "RELEASE_SHA" "$RUNNER_TEMP/verified/RELEASE_SHA"
          get "RELEASE_MANIFEST.sha256" "$RUNNER_TEMP/verified/RELEASE_MANIFEST.sha256"
          quit
          EOF
          bash tools/run_production_sftp.sh "$RUNNER_TEMP/verify-metadata.sftp"
          cmp "$RUNNER_TEMP/release/RELEASE_SHA" "$RUNNER_TEMP/verified/RELEASE_SHA"
          cmp "$RUNNER_TEMP/release/RELEASE_MANIFEST.sha256" "$RUNNER_TEMP/verified/RELEASE_MANIFEST.sha256"

      - name: Verify public production responses
        shell: bash
        run: python3 tools/verify_production_http.py --base-url https://smps.rkcomputer.cz

      - name: Record deployed revision
        run: echo "Deployed tested revision ${DEPLOY_SHA} in ${DEPLOY_MODE} mode."
