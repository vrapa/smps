name: Deploy production

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful CI workflow run ID from the default branch
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tested revision
    runs-on: ubuntu-latest
    outputs:
      deploy_sha: ${{ steps.ci.outputs.deploy_sha }}
    env:
      CI_RUN_ID: ${{ inputs.ci_run_id }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Validate the selected CI run
        id: ci
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$CI_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo 'The CI run ID must contain digits only.' >&2
            exit 1
          fi

          default_branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')"
          if [[ "$GITHUB_REF" != "refs/heads/${default_branch}" ]]; then
            echo 'Run the production workflow only from the default branch.' >&2
            exit 1
          fi
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}")"

          if ! jq --exit-status --arg branch "$default_branch" '
            .name == "CI"
            and .event == "push"
            and .status == "completed"
            and .conclusion == "success"
            and .head_branch == $branch
          ' <<< "$run_json" >/dev/null; then
            echo 'Select a successful completed CI push run from the default branch.' >&2
            exit 1
          fi

          deploy_sha="$(jq --raw-output '.head_sha' <<< "$run_json")"
          echo "deploy_sha=$deploy_sha" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy tested artifact over SFTP
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: https://github.com/${{ github.repository }}/actions/runs/${{ inputs.ci_run_id }}
    env:
      CI_RUN_ID: ${{ inputs.ci_run_id }}
      DEPLOY_SHA: ${{ needs.validate.outputs.deploy_sha }}
      GH_TOKEN: ${{ github.token }}

    steps:

      - name: Check out policy from the trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Download the tested artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/artifact"
          gh run download "$CI_RUN_ID" \
            --name "smps-${DEPLOY_SHA}" \
            --dir "$RUNNER_TEMP/artifact"

      - name: Verify and extract the artifact
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/artifact/smps-${DEPLOY_SHA}.tar.gz"

          test -f "$archive"
          python3 tools/audit_public_content.py archive "$archive"

          mkdir -p "$RUNNER_TEMP/release"
          tar --extract --gzip --file "$archive" \
            --directory "$RUNNER_TEMP/release" \
            --no-same-owner \
            --no-same-permissions

      - name: Configure pinned SFTP host identity
        shell: bash
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PRIVATE_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
          SFTP_PORT: ${{ vars.SFTP_PORT || '22' }}
          SFTP_REMOTE_PATH: ${{ vars.SFTP_REMOTE_PATH }}
        run: |
          set -euo pipefail
          for required_value in \
            "$SFTP_HOST" \
            "$SFTP_USERNAME" \
            "$SFTP_PRIVATE_KEY" \
            "$SFTP_KNOWN_HOSTS" \
            "$SFTP_REMOTE_PATH"; do
            if [[ -z "$required_value" ]]; then
              echo 'A required production environment secret or variable is missing.' >&2
              exit 1
            fi
          done

          if [[ ! "$SFTP_PORT" =~ ^[0-9]+$ ]]; then
            echo 'SFTP_PORT must contain digits only.' >&2
            exit 1
          fi

          install -d -m 700 "$RUNNER_TEMP/smps-ssh"
          printf '%s\n' "$SFTP_PRIVATE_KEY" > "$RUNNER_TEMP/smps-ssh/id_ed25519"
          printf '%s\n' "$SFTP_KNOWN_HOSTS" > "$RUNNER_TEMP/smps-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/smps-ssh/id_ed25519" "$RUNNER_TEMP/smps-ssh/known_hosts"

      - name: Upload without deleting remote files
        shell: bash
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PORT: ${{ vars.SFTP_PORT || '22' }}
          SFTP_REMOTE_PATH: ${{ vars.SFTP_REMOTE_PATH }}
        run: |
          set -euo pipefail
          batch_file="$RUNNER_TEMP/smps-ssh/deploy.sftp"
          printf '%s\n' \
            'put .htaccess' \
            'put -R app' \
            'put -R bin' \
            'put -R config' \
            'put -R db' \
            'put -R vendor' \
            'put -R www' \
            'put composer.json' \
            'put composer.lock' \
            'put README.md' \
            'put THIRD_PARTY_NOTICES.md' \
            > "$batch_file"

          cd "$RUNNER_TEMP/release"
          sftp \
            -b "$batch_file" \
            -i "$RUNNER_TEMP/smps-ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/smps-ssh/known_hosts" \
            -P "$SFTP_PORT" \
            "${SFTP_USERNAME}@${SFTP_HOST}:${SFTP_REMOTE_PATH}"

      - name: Record deployed revision
        run: echo "Deployed tested revision ${DEPLOY_SHA}."
